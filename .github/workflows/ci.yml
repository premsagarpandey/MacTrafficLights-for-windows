name: Build and Test CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Windows x64 Visual Studio Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild & MSVC Environment
        uses: microsoft/setup-msbuild@v2

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Standalone Solution (Release x64)
        run: msbuild MacTrafficLights.sln /p:Configuration=Release /p:Platform=x64

      - name: Compile Automated Smoke Test Suite
        run: cl /std:c++17 /O2 /EHsc /DUNICODE /D_UNICODE /Iinclude tests\test_smoke.cpp src\Config.cpp src\Logger.cpp src\Diagnostic.cpp src\NativeActions.cpp src\WindowFilter.cpp /Fe:test_smoke.exe /link user32.lib gdi32.lib shell32.lib dwmapi.lib psapi.lib advapi32.lib

      - name: Run Smoke Tests
        run: .\test_smoke.exe

      - name: Upload Standalone Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacTrafficLights-x64
          path: x64/Release/MacTrafficLights.exe
