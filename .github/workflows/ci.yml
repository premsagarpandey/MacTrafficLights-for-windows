name: Build and Test CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-msvc:
    name: Build with MSVC (Visual Studio 2022)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Solution (Release x64)
        run: msbuild MacTrafficLights.sln /p:Configuration=Release /p:Platform=x64

  build-cmake:
    name: Build with CMake & Smoke Tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -A x64

      - name: Build with CMake (Release)
        run: cmake --build build --config Release

      - name: Run Smoke Tests
        run: .\build\Release\test_smoke.exe
