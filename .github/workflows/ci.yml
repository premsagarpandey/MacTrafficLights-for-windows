name: Build and Test CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Windows x64 Build & Verification
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake Build
        run: cmake -B build -A x64

      - name: Compile with CMake (Release x64)
        run: cmake --build build --config Release --verbose

      - name: Run Automated Smoke Tests
        run: .\build\Release\test_smoke.exe

      - name: Upload Standalone Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacTrafficLights-x64
          path: build/Release/MacTrafficLights.exe
